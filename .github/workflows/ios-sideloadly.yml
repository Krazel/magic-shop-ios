name: iOS Sideloadly IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-device-ipa:
    name: Build unsigned iPhone IPA for Sideloadly
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Build unsigned device IPA
        env:
          MAGIC_SHOP_IPA_OUTPUT: ${{ runner.temp }}/MagicShop-Sideloadly/MagicShop-0.3-build-1-unsigned.ipa
        run: bash scripts/build-sideloadly-ipa.sh

      - name: Record build manifest and checksum
        run: |
          ARTIFACT_ROOT="$RUNNER_TEMP/MagicShop-Sideloadly"
          shasum -a 256 "$ARTIFACT_ROOT/MagicShop-0.3-build-1-unsigned.ipa" > "$ARTIFACT_ROOT/SHA256SUMS.txt"
          cat > "$ARTIFACT_ROOT/build-manifest.txt" <<EOF
          App: Magic Shop
          Marketing version: 0.3
          Build: 1
          Commit: $GITHUB_SHA
          CI run: $GITHUB_RUN_ID
          Purpose: Local-QA
          Platform: physical iPhone (iphoneos)
          Signing: unsigned; Sideloadly must re-sign before installation
          Minimum iOS: 16.0
          EOF

      - name: Upload Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-0.3-build-1-${{ github.sha }}-Sideloadly
          path: ${{ runner.temp }}/MagicShop-Sideloadly/
          if-no-files-found: error
          retention-days: 14
