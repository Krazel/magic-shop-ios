name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Magic Shop
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Choose an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime in data.get("devices", {}).values()
              for device in runtime
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          preferred = [device for device in devices if device.get("name") == "iPhone 16 Pro"]
          chosen = (preferred or devices)
          if not chosen:
              raise SystemExit("No available iPhone simulator found")
          print(chosen[0]["udid"])
          ')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project MagicShop.xcodeproj \
            -scheme MagicShop \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run XCTest
        run: |
          set -o pipefail
          xcodebuild test \
            -project MagicShop.xcodeproj \
            -scheme MagicShop \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MagicShopTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package simulator build evidence
        if: success()
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/MagicShop.app"
          ARTIFACT_ROOT="$RUNNER_TEMP/MagicShop-0.1-build-2-CI"
          mkdir -p "$ARTIFACT_ROOT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARTIFACT_ROOT/MagicShop-simulator.app.zip"
          cat > "$ARTIFACT_ROOT/build-manifest.txt" <<EOF
          App: Magic Shop
          Marketing version: 0.1
          Build: 2
          Commit: $GITHUB_SHA
          CI run: $GITHUB_RUN_ID
          Purpose: GitHub-Actions-Simulator-QA
          Signing: unsigned simulator build
          EOF

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-0.1-build-2-${{ github.sha }}-Simulator-QA
          path: ${{ runner.temp }}/MagicShop-0.1-build-2-CI/
          if-no-files-found: error
          retention-days: 14

      - name: Upload XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-XCTest-${{ github.sha }}
          path: ${{ runner.temp }}/MagicShopTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
