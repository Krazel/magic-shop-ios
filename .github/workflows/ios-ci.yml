name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Capture living shop, care and pricing after an already tested presentation adjustment'
        type: boolean
        default: false
      interaction_check:
        description: 'Run all native UI tests and focused captures after previously passing unchanged Core/model tests'
        type: boolean
        default: false

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Magic Shop
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Choose an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime in data.get("devices", {}).values()
              for device in runtime
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          preferred = [device for device in devices if device.get("name") == "iPhone 16 Pro"]
          chosen = (preferred or devices)
          if not chosen:
              raise SystemExit("No available iPhone simulator found")
          print(chosen[0]["udid"])
          ')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build unsigned simulator app
        id: simulator_build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MagicShop.xcodeproj \
            -scheme MagicShop \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run XCTest
        id: tests
        if: inputs.capture_only != true
        run: |
          set -o pipefail
          TEST_SCOPE=()
          if [ "${{ inputs.interaction_check }}" = "true" ]; then TEST_SCOPE=(-only-testing:MagicShopUITests); fi
          xcodebuild test "${TEST_SCOPE[@]}" \
            -project MagicShop.xcodeproj \
            -scheme MagicShop \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MagicShopTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export XCTest diagnostics
        if: always() && steps.simulator_build.outcome == 'success' && steps.tests.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/TestDiagnostics"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/MagicShopTests.xcresult" > "$RUNNER_TEMP/TestDiagnostics/summary.json" || true
          cat "$RUNNER_TEMP/TestDiagnostics/summary.json"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/MagicShopTests.xcresult" --output-path "$RUNNER_TEMP/TestDiagnostics/attachments" || true
      - name: Upload XCTest diagnostics
        if: always() && steps.simulator_build.outcome == 'success' && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-TestDiagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/TestDiagnostics/
          retention-days: 14
      - name: Capture playable states on iPhone
        if: always() && steps.simulator_build.outcome == 'success'
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/MagicShop.app"
          mkdir -p "$RUNNER_TEMP/VisualQA"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          STATES="onboarding overview build placement stock living living-summary pricing care floors floor-laid drag improvements decor journal restored-right"
          if [ "${{ inputs.capture_only }}" = "true" ]; then STATES="living pricing care floors floor-laid stock"; fi
          if [ "${{ inputs.interaction_check }}" = "true" ]; then STATES="living pricing care floors floor-laid drag"; fi
          if [ "${{ inputs.interaction_check }}" = "true" ] && [ "${{ inputs.capture_only }}" = "true" ]; then STATES="floors"; fi
          for STATE in $STATES; do
            xcrun simctl terminate "$SIMULATOR_UDID" com.example.MagicShop || true
            xcrun simctl launch "$SIMULATOR_UDID" com.example.MagicShop --visual-state "$STATE"
            sleep 3
            xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/VisualQA/$STATE-runtime.png"
          done
          LARGE_STATES="stock pricing care floors"
          if [ "${{ inputs.interaction_check }}" = "true" ]; then LARGE_STATES="pricing care floors"; fi
          if [ "${{ inputs.interaction_check }}" = "true" ] && [ "${{ inputs.capture_only }}" = "true" ]; then LARGE_STATES="floors"; fi
          for STATE in $LARGE_STATES; do
            xcrun simctl terminate "$SIMULATOR_UDID" com.example.MagicShop || true
            xcrun simctl launch "$SIMULATOR_UDID" com.example.MagicShop --visual-state "$STATE" --large-text
            sleep 3
            xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/VisualQA/$STATE-large-text-runtime.png"
          done
          printf 'Commit: %s\nRun: %s\nSimulator: %s\nSource: real simulator app with isolated deterministic game-state fixtures\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SIMULATOR_UDID" > "$RUNNER_TEMP/VisualQA/capture-manifest.txt"
      - name: Capture compact iPhone layout
        if: always() && steps.simulator_build.outcome == 'success'
        run: |
          set -euo pipefail
          SMALL_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable")]
          names=["iPhone SE (3rd generation)","iPhone 13 mini","iPhone 12 mini","iPhone 16e"]
          match=next((d for name in names for d in devices if d["name"]==name),None)
          print(match["udid"] if match else "")')"
          if [ -z "$SMALL_UDID" ]; then
            echo 'Compact simulator unavailable on this runner' >> "$RUNNER_TEMP/VisualQA/capture-manifest.txt"
            exit 0
          fi
          xcrun simctl boot "$SMALL_UDID" || true
          xcrun simctl bootstatus "$SMALL_UDID" -b
          xcrun simctl status_bar "$SMALL_UDID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SMALL_UDID" "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/MagicShop.app"
          STATES="onboarding stock placement pricing care floors living"
          if [ "${{ inputs.capture_only }}" = "true" ]; then STATES="living pricing care floors floor-laid stock"; fi
          if [ "${{ inputs.interaction_check }}" = "true" ]; then STATES="pricing care floors living"; fi
          if [ "${{ inputs.interaction_check }}" = "true" ] && [ "${{ inputs.capture_only }}" = "true" ]; then STATES="floors"; fi
          for STATE in $STATES; do
            xcrun simctl terminate "$SMALL_UDID" com.example.MagicShop || true
            xcrun simctl launch "$SMALL_UDID" com.example.MagicShop --visual-state "$STATE"
            sleep 3
            xcrun simctl io "$SMALL_UDID" screenshot "$RUNNER_TEMP/VisualQA/$STATE-compact-runtime.png"
          done
          printf 'Compact simulator: %s\n' "$SMALL_UDID" >> "$RUNNER_TEMP/VisualQA/capture-manifest.txt"
      - name: Upload runtime capture
        if: always() && steps.simulator_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-VisualQA-${{ github.sha }}
          path: ${{ runner.temp }}/VisualQA/
          if-no-files-found: error
          retention-days: 14
      - name: Package simulator build evidence
        if: success()
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/MagicShop.app"
          ARTIFACT_ROOT="$RUNNER_TEMP/MagicShop-0.3-build-1-CI"
          mkdir -p "$ARTIFACT_ROOT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARTIFACT_ROOT/MagicShop-simulator.app.zip"
          cat > "$ARTIFACT_ROOT/build-manifest.txt" <<EOF
          App: Magic Shop
          Marketing version: 0.3
          Build: 1
          Commit: $GITHUB_SHA
          CI run: $GITHUB_RUN_ID
          Purpose: GitHub-Actions-Simulator-QA
          Signing: unsigned simulator build
          EOF

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-0.3-build-1-${{ github.sha }}-Simulator-QA
          path: ${{ runner.temp }}/MagicShop-0.3-build-1-CI/
          if-no-files-found: error
          retention-days: 14

      - name: Upload XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicShop-XCTest-${{ github.sha }}
          path: ${{ runner.temp }}/MagicShopTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
